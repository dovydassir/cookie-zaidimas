<!DOCTYPE html>
<html lang="lt">
    <head>
        <meta charset="UTF-8">

        <title>Cookie Clicker</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        
        <h1>Cookie Clicker </h1>
        <button class="resetBtn"><strong>Reset Game</strong></button>
        <button class="musicBtn"><strong>Play Music</strong></button>
        <button class="themeBtn"> Dark Mode</button>
        <p><strong>Cookies: </strong><span class="cookies">0</span></p>
    

        

        <div class="cookieConteiner">
        <button class="cookie">Gauti sausainį
            <img src="img/sausainis.png" height="100px", width="100px">
        </button>
        </div>
        
        
    <div class="cookieblock"> 
        
        <div class="shopConteiner">
            <div class="card">
                <h2>Parduotuvė</h2>
                <button class="upgrade">Pirk <strong>+2 per sekundę !!! </strong></button>  
                <p>Kaina 5 sausainių 🍪</p>
                <button class="upgrade">Pirk <strong>+5 per sekundę !!! </strong></button>  
                <p>Kaina 10 sausainių 🍪</p>
                <button class="upgrade">Prik <strong>+10 per sekundę !!! </strong></button>  
                <p>Kaina 20 sausainių 🍪</p>
            </div>
        </div>   

        
        
        <div class="strongConteiner">
            <div class="card">
                <h2>Strong Click Upgrade</h2>
                <button class="strongClick"><strong>Geresnis click !!! :</strong> </button>
                <p>Kaina: 20  <img src="img\lekste.png" height="100px", width="100px"></p>
                <p><strong>Click vertė : </strong> <span class="clickValue">1</span></p>

            </div>
        </div>
        
    </div>


    
       
        
        <script src="script.js"></script>
    </body>
</html>
