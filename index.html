<!DOCTYPE html>
<html lang="lt">
    <head>
        <meta charset="UTF-8">

        <title>Cookie Clicker</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>


        <h1>Cookie Clicker </h1>

        <p>Cookies: <span class="cookies">0</span></p>
        <button class="cookie">Gauti sausainį <img src="img/sausainis.png" height="100px", width="100px"></button>

        <h2>Parduotuvė</h2>

        <button class="upgrade">Pirk <strong>+2 per sekundę !!! :</strong>  už 5 sausainių 🍪</button>
        <button class="upgrade">Pirk <strong>+5 per sekundę !!! :</strong>  už 10 sausainių 🍪</button>
        <button class="upgrade">Prik <strong>+10 per sekundę !!! :</strong>  už 20 sausainių 🍪</button>

        <h2>Strong Click Upgrade</h2>
        <button class="strongClick"><strong>Geresnis click !!! :</strong> už 20 sausainių <img src="img\lekste.png" height="100px", width="100px"></button>
        <p><strong>Click vertė : </strong> <span class="clickValue">1</span></p>
        



        


        <script src="script.js"></script>
    </body>
</html>
